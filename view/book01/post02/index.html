<html>
<head>
    <title>Test View</title>
</head>
<body>
<canvas id="canvasId" style="width:600px; height: 50px;"></canvas>
<!-- Dependencies -->
<script src="../../../node_modules/paper/dist/paper-full.js"></script>
<script src="../../../dist/bundle.js" type="text/javascript"></script>
<script type="text/javascript">
    console.log(geomlib);
    let Color = geomlib.Color;
    let Align = geomlib.Align;
    let E = geomlib.E;
    geomlib.init({
        background: '#ffe9cd',
        title: "Post.1",
        align: Align.ABOVE,
        canvasid: "canvasId",
        elements: [
            {
                name: "A",
                construction: E.Point.free,
                params: [250, 30]
            },
            {
                name: "B",
                construction: E.Point.free,
                params: [350, 30]
            },
            {
                name: "C",
                construction: E.Point.lineSlider,
                params: ["A", "B", 100, 30, 0]
            },
            {
                name: "D",
                construction: E.Point.lineSlider,
                params: ["A", "B", 500, 30, 0]
            },
            {
                name: "CD",
                construction: E.Line.connect,
                params: ["C", "D"]
            },
        ]
    })

</script>
</body>
</html>
