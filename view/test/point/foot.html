<script type="text/javascript">

    let Color = geomlib.Color;
    let Align = geomlib.Align;
    let E = geomlib.E;
    geomlib.init({
        background: '#ffe9cd',
        title: "lemma for X.33",
        align: Align.ABOVE,
        canvasid: "canvasId",
        elements: [
            {
                name: "B",
                construction: E.Point.free,
                params: [30, 170]
            },
            {
                name: "C",
                construction: E.Point.free,

                vertexColor: 0

            {
                name: "ABC",

                params: ["BCmid", "B"],

                vertexColor: 0,
                edgeColor: 0,
                faceColor: 0
            },
            {
                name: "A",
                construction: E.Point.circleSlider,
                params: ["ABC", 120, 40]
            },
            {
                name: "M",
