<html>
<head>
    <title>Test View - Sector.sector (Def III.10)</title>
</head>
<body>
<canvas id="canvasId" style="width:600px; height: 600px;"></canvas>
<!-- Dependencies -->
<script src="../../../dist/bundle.js" type="text/javascript"></script>
<script type="text/javascript">
    console.log(geomlib);
    let Color = geomlib.Color;
    let Align = geomlib.Align;
    let E = geomlib.E;
    geomlib.init({
        background: '#ffe9cd',
        title: "Def III.10 — A sector of a circle",
        align: Align.ABOVE,
        canvasid: "canvasId",
        elements: [
            {
                name: "A",
                construction: E.Point.free,
                params: [200, 200]
            },
            {
                name: "B",
                construction: E.Point.free,
                params: [200, 300]
            },
            {
                name: "C",
                construction: E.Circle.radius,
                params: ["B", "A"],
                faceColor: "random"
            },
            {
                name: "D",
                construction: E.Point.circleSlider,
                params: ["C", 200, 400, 0]
            },
            {
                name: "E",
                construction: E.Sector.sector,
                params: ["B", "A", "D"],
                faceColor: "random"
            }
        ]
    })

</script>
</body>
</html>
