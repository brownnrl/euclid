<html>
<head>
    <title>Test View - Circle.radius (Post.3)</title>
</head>
<body>
<canvas id="canvasId" style="width:600px; height: 600px;"></canvas>
<!-- Dependencies -->
<script src="../../../dist/bundle.js" type="text/javascript"></script>
<script type="text/javascript">
    console.log(geomlib);
    let Color = geomlib.Color;
    let Align = geomlib.Align;
    let E = geomlib.E;
    geomlib.init({
        background: '#ffe9cd',
        title: "Post.3 — To describe a circle with any center and distance",
        align: Align.ABOVE,
        canvasid: "canvasId",
        elements: [
            {
                name: "A",
                construction: E.Point.free,
                params: [200, 200]
            },
            {
                name: "B",
                construction: E.Point.free,
                params: [200, 300]
            },
            {
                name: "C",
                construction: E.Circle.radius,
                params: ["B", "A"]
            }
        ]
    })

</script>
</body>
</html>
